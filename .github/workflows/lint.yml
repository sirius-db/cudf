name: lint

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check-style:
    # runs on GitHub-hosted runners inside rapidsai/ci-conda - no self-hosted
    # runners, no DinD, none of build-libcudf.yml's infra needed here.
    #
    # This replicates rapidsai/shared-workflows' checks.yaml `check-style` job
    # directly instead of calling that reusable workflow, because its `get-pr-info`
    # step (nv-gha-runners/get-pr-info) throws on `push` events unless the branch
    # name matches RAPIDS' internal `pull-request/<number>` convention - it would
    # hard-fail every push to main/release/**. ci/check_style.sh doesn't actually
    # use that step's output (RAPIDS_BASE_BRANCH), so it's just dropped entirely.
    runs-on: ubuntu-latest
    container:
      # pinned to the "latest" tag's digest at time of writing - zizmor flags plain
      # `:latest` as unpinned; bump this digest deliberately when a newer image is
      # needed rather than letting it float.
      image: rapidsai/ci-conda@sha256:58b689de68b54d61961e8dcd197606719a799fbe819b9ae12b74a7b8195dadb1
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # split restore/save instead of the single actions/cache step zizmor flagged
      # as cache-poisoning-prone: this workflow runs on `pull_request` (untrusted
      # PRs) as well as `push` to main/release/**, so only the trusted push path
      # should be allowed to write the cache; PRs only ever read from it.
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-0|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Determine pre-commit diff range
        id: diff-range
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${GITHUB_BASE_REF}" --depth=1
            echo "from_ref=origin/${GITHUB_BASE_REF}" >> "$GITHUB_OUTPUT"
          else
            # push: compare against the previous commit on this ref. Falls back to
            # HEAD~1, and then to checking the whole repo, if "before" isn't usable -
            # it can be all-zeros (brand-new branch) or a real-looking SHA that's no
            # longer resolvable at all (force-push/history-rewrite orphaned it, even
            # with fetch-depth: 0 on checkout, since that only fetches what's
            # currently reachable from remote refs).
            before="$EVENT_BEFORE"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              before="HEAD~1"
            fi
            if git cat-file -e "${before}^{commit}" 2>/dev/null; then
              echo "from_ref=$before" >> "$GITHUB_OUTPUT"
            else
              echo "from_ref=" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Run pre-commit on changed files
        # reimplements ci/check_style.sh's setup (conda env, cmake-format fetch)
        # instead of calling the script directly, because it hardcodes
        # `pre-commit run --all-files` with no way to pass different args - we only
        # want to check files actually touched by a given PR/push, not the whole
        # repo (a full-repo sweep surfaces pre-existing drift unrelated to what a
        # dev is actually changing). This means we no longer auto-inherit future
        # changes to ci/check_style.sh's setup - acceptable tradeoff since the
        # script gives us no other way to do this.
        run: |
          rapids-logger "Create checks conda environment"
          . /opt/conda/etc/profile.d/conda.sh
          conda config --set channel_priority strict

          ENV_YAML_DIR="$(mktemp -d)"
          rapids-dependency-file-generator \
            --output conda \
            --file-key checks \
            --matrix "cuda=${RAPIDS_CUDA_VERSION%.*};arch=$(arch);py=${RAPIDS_PY_VERSION}" | tee "${ENV_YAML_DIR}/env.yaml"

          rapids-mamba-retry env create --yes -f "${ENV_YAML_DIR}/env.yaml" -n checks
          conda activate checks

          RAPIDS_BRANCH="$(cat RAPIDS_BRANCH)"
          FORMAT_FILE_URL="https://raw.githubusercontent.com/rapidsai/rapids-cmake/${RAPIDS_BRANCH}/cmake-format-rapids-cmake.json"
          export RAPIDS_CMAKE_FORMAT_FILE=/tmp/rapids_cmake_ci/cmake-format-rapids-cmake.json
          mkdir -p "$(dirname "${RAPIDS_CMAKE_FORMAT_FILE}")"
          wget -O "${RAPIDS_CMAKE_FORMAT_FILE}" "${FORMAT_FILE_URL}"

          if [ -n "${STEPS_DIFF_RANGE_OUTPUTS_FROM_REF}" ]; then
            pre-commit run --show-diff-on-failure --from-ref "${STEPS_DIFF_RANGE_OUTPUTS_FROM_REF}" --to-ref HEAD
          else
            # no usable diff range was found (see previous step) - fall back to
            # checking the whole repo rather than silently skipping the check
            pre-commit run --show-diff-on-failure --all-files
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          STEPS_DIFF_RANGE_OUTPUTS_FROM_REF: ${{ steps.diff-range.outputs.from_ref }}

      - if: github.event_name == 'push'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-0|${{ hashFiles('.pre-commit-config.yaml') }}
